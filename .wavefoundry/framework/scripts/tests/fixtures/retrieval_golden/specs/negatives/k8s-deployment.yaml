apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: storefront-web
      namespace: retail
      labels:
        app: storefront-web
        tier: frontend
    spec:
      replicas: 3
      revisionHistoryLimit: 5
      selector:
        matchLabels:
          app: storefront-web
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      template:
        metadata:
          labels:
            app: storefront-web
            tier: frontend
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9102"
        spec:
          serviceAccountName: storefront-web
          containers:
            - name: web
              image: registry.example.com/retail/storefront-web:1.42.7
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: NODE_ENV
                  value: production
                - name: SESSION_REDIS_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: storefront-config
                      key: redisHost
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              readinessProbe:
                httpGet:
                  path: /healthz/ready
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz/live
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 20
  - apiVersion: v1
    kind: Service
    metadata:
      name: storefront-web
      namespace: retail
    spec:
      type: ClusterIP
      selector:
        app: storefront-web
      ports:
        - name: http
          port: 80
          targetPort: http
